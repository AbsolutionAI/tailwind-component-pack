<!-- Contact Form -->
<section class="py-20 bg-gray-50 dark:bg-gray-800">
  <div class="max-w-2xl mx-auto px-4">
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white text-center">Contact us</h2>
    <form class="mt-8 space-y-6">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">First name</label>
          <input type="text" class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" placeholder="John" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Last name</label>
          <input type="text" class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" placeholder="Doe" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
        <input type="email" class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" placeholder="john@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Message</label>
        <textarea rows="4" class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" placeholder="Your message..."></textarea>
      </div>
      <button class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-medium hover:bg-primary-700">Send message</button>
    </form>
  </div>
</section>

<!-- Newsletter Signup -->
<section class="py-20 bg-white dark:bg-gray-900">
  <div class="max-w-lg mx-auto px-4">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Subscribe to our newsletter</h2>
      <p class="mt-2 text-gray-600 dark:text-gray-400">Get the latest news and updates.</p>
    </div>
    <form class="mt-6 flex gap-2">
      <input type="email" placeholder="you@example.com" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" />
      <button class="bg-primary-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-primary-700">Subscribe</button>
    </form>
  </div>
</section>

<!-- Login Form -->
<section class="min-h-[400px] flex items-center justify-center bg-gray-50 dark:bg-gray-800">
  <div class="w-full max-w-sm bg-white dark:bg-gray-700 rounded-2xl p-8 shadow-sm border border-gray-200 dark:border-gray-600">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white text-center">Welcome back</h2>
    <form class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
        <input type="email" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
        <input type="password" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500" />
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-600 dark:text-gray-400"><input type="checkbox" class="rounded" /> Remember me</label>
        <a href="#" class="text-primary-600 dark:text-primary-400 hover:underline">Forgot password?</a>
      </div>
      <button class="w-full bg-primary-600 text-white py-2 rounded-lg font-medium hover:bg-primary-700">Sign in</button>
    </form>
  </div>
</section>
